<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0a" />
    <meta
      name="description"
      content="Land Rover Defender 110 V8 — 5.0L Supercharged 525 PS cinematic interactive WebGL showcase."
    />
    <title>Land Rover Defender V8 — Cinematic Showcase</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0c0a'/%3E%3Crect x='5' y='13' width='22' height='6' fill='%23e0541f'/%3E%3C/svg%3E"
    />
    <style>:root{--bg-void:#0b0c0a;--bg-surface:#141512;--text-bone:#e8e2d3;--text-muted:#8d8779;--accent-signal:#e0541f;--hairline:#e8e2d329;--scroll-height:900vh}*,:before,:after{box-sizing:border-box}html,body{background-color:#0b0c0a;background-color:var(--bg-void);color:var(--text-bone);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0;padding:0;overflow-x:hidden}#defender-canvas{z-index:1;pointer-events:none;width:100%;height:100%;display:block;position:fixed;inset:0}#scroll-stage{width:100%;height:900vh;height:var(--scroll-height,900vh);position:relative}.letterbox-bar{z-index:40;background-color:#0b0c0a;justify-content:space-between;align-items:center;height:40px;padding:0 clamp(16px,3vw,40px);display:flex;position:fixed;left:0;right:0}.letterbox-top{border-bottom:1px solid #e8e2d329;top:0}.letterbox-bottom{border-top:1px solid #e8e2d329;bottom:0}#hud-layer{z-index:20;pointer-events:none;position:fixed;inset:0}#loader-curtain{z-index:900;background-color:#0b0c0a;flex-direction:column;justify-content:center;align-items:center;gap:14px;transition:opacity .45s cubic-bezier(.16,1,.3,1);display:flex;position:fixed;inset:0}#loader-curtain[data-loaded=true]{opacity:0;pointer-events:none}#loader-percent{letter-spacing:.24em;color:#e8e2d3;font-family:IBM Plex Mono,ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem}.loader-track{background-color:#e8e2d329;width:min(220px,60vw);height:1px;overflow:hidden}#loader-bar{transform-origin:0;background-color:#e0541f;width:100%;height:100%;transition:transform .2s ease-out;transform:scaleX(0)}@media (prefers-reduced-motion:reduce){#loader-curtain,#loader-bar{transition:none}}</style>
    <script type="module" crossorigin src="/assets/index-DIhouXEN.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DUCdsbuv.css">
  </head>
  <body>
    <div id="loader-curtain" role="status" aria-live="polite" aria-label="Loading 3D showcase">
      <div id="loader-percent">000%</div>
      <div class="loader-track" aria-hidden="true">
        <div id="loader-bar"></div>
      </div>
    </div>

    <canvas id="defender-canvas" aria-label="Interactive 3D Land Rover Defender V8"></canvas>

    <header class="letterbox-bar letterbox-top" aria-label="Primary controls"></header>

    <main id="hud-layer" aria-label="Showcase interface">
      <div id="hero-root" aria-label="Hero introduction"></div>
      <section id="chapter-root" aria-live="polite" aria-label="Current chapter"></section>
      <nav id="rail-root" aria-label="Chapter progress"></nav>
      <div id="gauge-root" role="region" aria-label="Engine RPM and speed gauge"></div>
      <div id="rev-root" role="region" aria-label="Engine rev control"></div>
      <div id="sound-root" role="region" aria-label="Audio controls"></div>
    </main>

    <footer class="letterbox-bar letterbox-bottom" aria-label="Showcase metadata">
      <div id="footer-root"></div>
    </footer>

    <div id="cursor-root" aria-hidden="true"></div>
    <div id="modal-root"></div>

    <div id="scroll-stage" aria-hidden="true"></div>

  </body>
</html>
