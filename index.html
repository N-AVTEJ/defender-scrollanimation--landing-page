<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0a" />
    <meta
      name="description"
      content="Land Rover Defender 110 V8 — 5.0L Supercharged 525 PS cinematic interactive WebGL showcase."
    />
    <title>Land Rover Defender V8 — Cinematic Showcase</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0c0a'/%3E%3Crect x='5' y='13' width='22' height='6' fill='%23e0541f'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg-void: #0b0c0a;
        --bg-surface: #141512;
        --text-bone: #e8e2d3;
        --text-muted: #8d8779;
        --accent-signal: #e0541f;
        --hairline: rgba(232, 226, 211, 0.16);
        --scroll-height: 900vh;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0c0a;
        background-color: var(--bg-void);
        color: #e8e2d3;
        color: var(--text-bone);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #defender-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
        pointer-events: none;
      }

      #scroll-stage {
        position: relative;
        width: 100%;
        height: 900vh;
        height: var(--scroll-height, 900vh);
      }

      .letterbox-bar {
        position: fixed;
        left: 0;
        right: 0;
        height: 40px;
        background-color: #0b0c0a;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(16px, 3vw, 40px);
      }

      .letterbox-top {
        top: 0;
        border-bottom: 1px solid rgba(232, 226, 211, 0.16);
      }

      .letterbox-bottom {
        bottom: 0;
        border-top: 1px solid rgba(232, 226, 211, 0.16);
      }

      #hud-layer {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
      }

      #loader-curtain {
        position: fixed;
        inset: 0;
        z-index: 900;
        background-color: #0b0c0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #loader-curtain[data-loaded='true'] {
        opacity: 0;
        pointer-events: none;
      }

      #loader-percent {
        font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.24em;
        color: #e8e2d3;
      }

      .loader-track {
        width: min(220px, 60vw);
        height: 1px;
        background-color: rgba(232, 226, 211, 0.16);
        overflow: hidden;
      }

      #loader-bar {
        width: 100%;
        height: 100%;
        background-color: #e0541f;
        transform-origin: left center;
        transform: scaleX(0);
        transition: transform 0.2s ease-out;
      }

      @media (prefers-reduced-motion: reduce) {
        #loader-curtain,
        #loader-bar {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader-curtain" role="status" aria-live="polite" aria-label="Loading 3D showcase">
      <div id="loader-percent">000%</div>
      <div class="loader-track" aria-hidden="true">
        <div id="loader-bar"></div>
      </div>
    </div>

    <canvas id="defender-canvas" aria-label="Interactive 3D Land Rover Defender V8"></canvas>

    <header class="letterbox-bar letterbox-top" aria-label="Primary controls"></header>

    <main id="hud-layer" aria-label="Showcase interface">
      <div id="hero-root" aria-label="Hero introduction"></div>
      <section id="chapter-root" aria-live="polite" aria-label="Current chapter"></section>
      <nav id="rail-root" aria-label="Chapter progress"></nav>
      <div id="gauge-root" role="region" aria-label="Engine RPM and speed gauge"></div>
      <div id="rev-root" role="region" aria-label="Engine rev control"></div>
      <div id="sound-root" role="region" aria-label="Audio controls"></div>
    </main>

    <footer class="letterbox-bar letterbox-bottom" aria-label="Showcase metadata">
      <div id="footer-root"></div>
    </footer>

    <div id="cursor-root" aria-hidden="true"></div>
    <div id="modal-root"></div>

    <div id="scroll-stage" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
