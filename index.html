<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0a" />
    <meta
      name="description"
      content="Land Rover Defender 110 V8 — 5.0L Supercharged 525 PS cinematic interactive WebGL showcase."
    />
    <title>Land Rover Defender V8 — Cinematic Showcase</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0c0a'/%3E%3Crect x='5' y='13' width='22' height='6' fill='%23e0541f'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg-void: #0b0c0a;
        --text-bone: #e8e2d3;
        --accent-signal: #e0541f;
        --hairline: rgba(232, 226, 211, 0.16);
        --scroll-height: 900vh;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0c0a;
        color: #e8e2d3;
        overflow-x: hidden;
      }
      #defender-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
      }
      #scroll-stage {
        position: relative;
        width: 100%;
        height: 900vh;
      }
      #loader-curtain {
        position: fixed;
        inset: 0;
        z-index: 900;
        background-color: #0b0c0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      #loader-curtain[data-loaded='true'] {
        opacity: 0;
        pointer-events: none;
      }
      #loader-percent {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.875rem;
        letter-spacing: 0.24em;
        color: #e8e2d3;
      }
      .loader-track {
        width: min(240px, 64vw);
        height: 1px;
        background-color: rgba(232, 226, 211, 0.16);
        overflow: hidden;
      }
      #loader-bar {
        width: 100%;
        height: 100%;
        background-color: #e0541f;
        transform-origin: left center;
        transform: scaleX(0);
      }
    </style>
  </head>
  <body>
    <div
      id="loader-curtain"
      data-testid="loader"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      aria-label="Loading 3D showcase"
      data-loading="true"
      data-loaded="false"
    >
      <span class="loader-label">DEFENDER V8 · CALIBRATING</span>
      <div id="loader-percent" data-testid="loader-percent">000%</div>
      <div class="loader-track" aria-hidden="true">
        <div id="loader-bar"></div>
      </div>
    </div>

    <canvas
      id="defender-canvas"
      data-testid="webgl-canvas"
      aria-label="Interactive 3D Land Rover Defender V8"
    ></canvas>

    <div class="grain-overlay" data-testid="grain-overlay" aria-hidden="true"></div>

    <header class="letterbox-bar letterbox-top" data-testid="letterbox-top" aria-label="Primary controls">
      <div class="top-brand-mark">
        <span class="top-brand-dot" aria-hidden="true"></span>
        <span>LAND ROVER · DEFENDER V8</span>
      </div>
      <div id="sound-root" role="region" aria-label="Audio controls"></div>
    </header>

    <main id="hud-layer" aria-label="Showcase interface">
      <div id="hero-root" aria-label="Hero introduction"></div>
      <section id="chapter-root" aria-live="polite" aria-label="Current chapter"></section>
      <nav id="rail-root" aria-label="Chapter navigation"></nav>
      <div id="gauge-root" role="region" aria-label="Engine RPM and speed gauge"></div>
      <div id="rev-root" role="region" aria-label="Engine rev control"></div>
    </main>

    <footer class="letterbox-bar letterbox-bottom" data-testid="letterbox-bottom" aria-label="Showcase metadata">
      <div id="footer-root" style="width: 100%"></div>
    </footer>

    <div id="cursor-root" aria-hidden="true"></div>
    <div id="modal-root"></div>

    <div id="scroll-stage" data-testid="scroll-container" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
